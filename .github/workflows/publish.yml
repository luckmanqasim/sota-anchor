name: Publish

# Uploads the package to PyPI when a GitHub release is published. PyPI trusts
# this workflow directly (Trusted Publishing), so no password or API token is
# stored anywhere: register it once on pypi.org as the project's publisher.
#
# Two jobs, so the one that can mint a PyPI token runs no project code. Tests and
# the build run third-party packages; they get no id-token and hand over only the
# built files. Actions are pinned to commits, since a moved tag would otherwise
# run new code with that token.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # No cache: a release builds from a clean slate, never a restored one.
          enable-cache: false

      - name: Check the release tag is the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "Release $TAG doesn't match the package version $version." >&2
            exit 1
          fi

      - name: Test from the lockfile
        run: |
          uv sync --locked --extra dev
          uv run python -m pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # No cache: a release builds from a clean slate, never a restored one.
          enable-cache: false

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
