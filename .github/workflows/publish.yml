name: Publish

# Uploads the package to PyPI when a GitHub release is published. PyPI trusts
# this workflow directly (Trusted Publishing), so no password or API token is
# stored anywhere: register it once on pypi.org as the project's publisher.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Check the release tag is the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "Release $TAG doesn't match the package version $version." >&2
            exit 1
          fi

      - name: Test from the lockfile
        run: |
          uv sync --locked --extra dev
          uv run python -m pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
