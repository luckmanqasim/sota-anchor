[project]
name = "sota-anchor"
version = "0.2.0"
description = "Finds libraries, tools and research released after your coding agent's training, before it rebuilds them from scratch: a search of the last year of papers, repositories and packages, as an MCP server and Claude Code plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luckman Qasim" }]
keywords = ["mcp", "llm", "agents", "claude-code", "cursor", "obsolescence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "mcp>=2.2.0",
    "httpx[http2]>=0.28.0",
    "pydantic>=2.10.0",
    "click>=8.1.8",
    "openai>=1.50.0",
]

[project.urls]
Homepage = "https://github.com/luckmanqasim/sota-anchor"
Repository = "https://github.com/luckmanqasim/sota-anchor"
Issues = "https://github.com/luckmanqasim/sota-anchor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
sota-anchor = "sota_anchor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sota_anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly so a contributor on a different ruff version gets the same
# result as CI rather than a moving default.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "RUF015",  # `list(x)[0]` reads more clearly than `next(iter(x))` in tests
]

[tool.ruff.lint.per-file-ignores]
# Fixtures carry non-ASCII deliberately, to prove the flattening works. (The
# fold tables in src/ write their code points as \u escapes, so they need no
# exemption.)
"tests/*" = ["RUF001"]
