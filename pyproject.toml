[project]
name = "sota-anchor"
version = "0.1.0"
description = "Breaks epistemic inertia in AI coding agents: dynamic model-catalog anchoring plus a 3-stage assumption-diffing engine backed by temporal-decay retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luckman Qasim" }]
keywords = ["mcp", "llm", "agents", "claude-code", "cursor", "obsolescence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "mcp>=2.2.0",
    "httpx[http2]>=0.28.0",
    "pydantic>=2.10.0",
    "click>=8.1.8",
    "openai>=1.50.0",
]

[project.urls]
Homepage = "https://github.com/luckmanqasim/sota-anchor"
Repository = "https://github.com/luckmanqasim/sota-anchor"
Issues = "https://github.com/luckmanqasim/sota-anchor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
sota-anchor = "sota_anchor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sota_anchor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
